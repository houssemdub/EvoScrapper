services:
  evoscrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evoscrapper
    restart: unless-stopped
    ports:
      - "8009:8009"
      - "50000:50000/tcp"
      - "50000:50000/udp"
      - "50001:50001/udp"
    environment:
      - HOST=0.0.0.0
      - PORT=8009
      - DEBUG=false
      - API_KEY=${API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY:-}
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY:-}
      - DEBRIDLINK_API_KEY=${DEBRIDLINK_API_KEY:-}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY:-}
      - TORBOX_API_KEY=${TORBOX_API_KEY:-}
      - PIKPAK_USER=${PIKPAK_USER:-}
      - PIKPAK_PASSWORD=${PIKPAK_PASSWORD:-}
      - COMETNET_ENABLED=true
      - COMETNET_RELAYS=${COMETNET_RELAYS:-[]}
      - STREAM_CACHE_DIR=.stream_cache
      - STREAM_BIND_HOST=127.0.0.1
      - STREAMER_TOKEN=${STREAMER_TOKEN:-}
      - STREAM_URL_TTL_SECONDS=1800
      - MAX_DISK_CACHE_GB=15
      - TORRENT_PORT=50000
      - DHT_PORT=50001
    volumes:
      - ./data:/app/data
      - evoscrapper_stream_cache:/app/.stream_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  evoscrapper_stream_cache:
